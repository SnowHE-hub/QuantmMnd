# 需要在 GitHub → Settings → Secrets → Actions 里设置：TUSHARE_TOKEN
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 0"  # 每周日 UTC 02:00 跑集成测试

jobs:
  unit-tests:
    name: Unit Tests (no network / no data files)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # T-002：只装 .[dev] 时 38 个测试文件在收集阶段就 ImportError（scipy/akshare/langgraph/torch…），
      # pytest 直接中断。这里装默认测试集实际 import 到的依赖。
      # torch 用 CPU wheel（避免拉 CUDA 版）；cvxpy/mlflow/pymongo 未声明在任何 extra 里，chromadb 在 rag extra
      # 但 rag 还会拉 FlagEmbedding/unstructured 等重依赖——四者先显式安装，声明位置交 C1 决定。
      - name: Install dependencies used by the default test set
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[data,ml,llm,viz,dev]"
          pip install cvxpy "mlflow==3.12.0" pymongo chromadb   # mlflow 3.13+ 取消了文件系统 tracking 后端

      - name: Run unit tests (exclude integration)
        env:
          NO_NETWORK: "1"   # conftest.block_external_network 闸门：单元测试禁外网，漏标的联网测试立即响亮失败
        # 命令行 -m 会整体覆盖 pyproject addopts 里的 -m，所以这里必须写全：
        # = pyproject 默认过滤（requires_network/db/optional_deps、stale_panel_fixture）再去掉 integration
        run: |
          python -m pytest tests/ \
            -m "not integration and not requires_network and not requires_db and not requires_optional_deps and not stale_panel_fixture" \
            --tb=short \
            -q \
            --no-cov \
            --timeout=120

  weekly-integration:
    name: Integration Tests (weekly, requires secrets)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install all dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[data,ml,llm,dev]"

      - name: Run integration tests
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          python -m pytest tests/ \
            -m "integration" \
            --tb=short \
            -q \
            --no-cov \
            --timeout=300
