# 需要在 GitHub → Settings → Secrets → Actions 里设置：TUSHARE_TOKEN
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 0"  # 每周日 UTC 02:00 跑集成测试

jobs:
  unit-tests:
    name: Unit Tests (no network / no data files)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests (exclude integration)
        run: |
          python -m pytest tests/ \
            -m "not integration" \
            --tb=short \
            -q \
            --no-cov \
            --timeout=120

  weekly-integration:
    name: Integration Tests (weekly, requires secrets)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install all dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[data,ml,llm,dev]"

      - name: Run integration tests
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          python -m pytest tests/ \
            -m "integration" \
            --tb=short \
            -q \
            --no-cov \
            --timeout=300
