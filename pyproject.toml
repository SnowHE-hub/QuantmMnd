[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantmind"
version = "0.1.0"
description = "AI Agent-Driven Quantitative Investment Research System"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "QuantMind Author", email = "you@example.com"}]
keywords = ["quant", "agent", "llm", "investment", "rag", "backtest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]

# ----------------------------------------------------------------------------
# Core dependencies — 项目最小可运行集合
# 注：ML/DL/LLM/RAG/UI 等大依赖放到 optional-dependencies，按需安装
# 这样首次 `uv pip install -e .` 不会因为某个大包版本冲突全部失败
# ----------------------------------------------------------------------------
dependencies = [
    # Core
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<2.1",
    "polars>=0.20",
    "pyarrow>=14.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "tenacity>=8.2",
    "joblib>=1.3",
    "diskcache>=5.6",
    "rich>=13.0",
    "typer>=0.12",
    "tqdm>=4.66",
    "httpx>=0.27",
    "ratelimit>=2.2",
]

[project.optional-dependencies]
data = [
    "akshare>=1.12",
    "tushare>=1.4",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "openpyxl>=3.1",
    "fastparquet>=2024.2",
]

ml = [
    "scikit-learn>=1.4",
    "lightgbm>=4.1",
    "xgboost>=2.0",
    "statsmodels>=0.14",
    "scipy>=1.12",
    "numba>=0.59",
    "shap>=0.45",
]

dl = [
    "torch>=2.2",
    "transformers>=4.40",
    "accelerate>=0.30",
    "peft>=0.10",
    "trl>=0.9",
    "datasets>=2.18",
    "sentence-transformers>=2.7",
    "bitsandbytes>=0.43; sys_platform == 'linux'",
]

llm = [
    "langchain>=0.2",
    "langgraph>=0.1",
    "langchain-openai>=0.1",
    "langchain-community>=0.2",
    "openai>=1.30",
    "anthropic>=0.25",
    "dashscope>=1.17",
    "ollama>=0.3",
]

rag = [
    "chromadb>=0.5",
    "rank-bm25>=0.2",
    "FlagEmbedding>=1.2",
    "unstructured>=0.13",
    "pypdf>=4.0",
    "jieba>=0.42",
]

backtest = [
    # 注意：vectorbt 在 Python 3.11+ 上有时安装较慢，可单独装
    "vectorbt>=0.26",
    "empyrical-reloaded>=0.5",
    "quantstats>=0.0.62",
    "alphalens-reloaded>=0.4",
]

viz = [
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.20",
    "altair>=5.3",
    "streamlit>=1.30",
]

ui = [
    "streamlit>=1.30",
    "gradio>=4.0",
]

dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",
    "pytest-mock>=3.12",
    "pytest-timeout>=2.3",
    "ruff>=0.4",
    "mypy>=1.10",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "pre-commit>=3.6",
    "types-PyYAML",
    "types-requests",
]

serve = [
    "vllm>=0.4; sys_platform == 'linux'",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

# 一键全装（开发机推荐）
all = [
    "quantmind[data,ml,dl,llm,rag,backtest,viz,ui,dev]",
]

[project.urls]
Homepage = "https://github.com/your-handle/quantmind"
Repository = "https://github.com/your-handle/quantmind"
Issues = "https://github.com/your-handle/quantmind/issues"

[project.scripts]
quantmind = "quantmind.__main__:main"

# ----------------------------------------------------------------------------
# setuptools 包发现
# ----------------------------------------------------------------------------
[tool.setuptools.packages.find]
include = ["quantmind*"]
exclude = ["tests*", "notebooks*", "scripts*"]

# ----------------------------------------------------------------------------
# Ruff（代码风格）
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "data",
    "notebooks",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long（已交给 formatter）
    "B008",  # do not perform function calls in argument defaults（FastAPI / typer 风格）
    "N806",  # variable in function should be lowercase（量化里 X, y, IC 等大小写有惯例）
    "N803",  # argument name should be lowercase
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]
"notebooks/*" = ["E402", "F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ----------------------------------------------------------------------------
# Mypy
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = false  # 项目早期不开 strict，避免被语法淹没；core 模块单独开
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "quantmind.core.*"
disallow_untyped_defs = true

# ----------------------------------------------------------------------------
# Pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--cov=quantmind",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
]
markers = [
    "slow: requires real API calls (akshare/tushare/LLM)",
    "gpu: requires GPU",
    "integration: tests requiring network/Tushare/LLM or large data files — excluded from unit CI",
    "pit: Point-in-Time correctness tests (核心)",
]
asyncio_mode = "auto"
# 全局每测超时（保险丝）：任何单测 > 60s 直接 fail，杜绝"hang 8 小时"。
# thread 方法在卡住的阻塞 C 调用（如无超时的 socket.read）上会 dump 栈并终止进程，
# 是最后兜底；正常情况下联网测试已标 integration 不会触发。
timeout = 60
timeout_method = "thread"

[tool.coverage.run]
source = ["quantmind"]
omit = [
    "*/tests/*",
    "*/notebooks/*",
    "*/__main__.py",
    "*/ui/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
