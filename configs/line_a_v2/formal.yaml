# 主线 A v2 · 正式荐股配置（用户 2026-10-24 批准："影子运行的内容可以恢复正式荐股，资金闸门批准"）
# 正式荐股 = 冻结打分 + 事先验证过的组合与执行规则（T-052 主配置），每天生成正式日报；Agent 大脑的意见只作提示，不改持仓。
# kill_switch: true 时只出报告、不出委托；回退到影子运行只需把 enabled 改为 false。
version: 1
approval:
  research_report_approved: true
  capital_gate: approved_by_user
  approved_on: "2026-10-24"
  approved_by: user
  evidence_at_approval: >-
    T-052 模拟盘（2026-04-29 ~ 10-23，普跌行情）：10 万 +5.0%、100 万 +3.6%、1000 万 −10.5%，前 1500 等权 −21.5%；
    6 个月的超额 95% 区间全部包含 0；超额集中在 7–8 月，对调仓日敏感。研究闸门 v2 未通过。用户知情后批准。
enabled: true
kill_switch: false
go_live: "2026-10-26"            # 第一个交易日；首次调仓在 go_live 之后的第一个周频网格日
signal: ens_native_20d           # 冻结第 18 折模型包的每日 F3（f3_ens_20d）
rebalance_every_grid_points: 4   # 周频网格，每 4 期调一次（20 日契约）
execution:
  price: open                    # 次日开盘；模拟盘的 VWAP 稍好，但开盘价是可执行的保守口径
  commission_rate: 0.00025       # 按用户实际券商修改
  min_commission: 5.0
  transfer_rate: 0.00001
  participation: 0.05
tiers:
  aum_1e5:
    aum: 100000
    top_n: 10
    buffer_mult: 2.0
    boards: [MAIN, CHINEXT]       # 科创板 / 北交所要求前 20 个交易日日均资产 50 万元
  aum_1e6:
    aum: 1000000
    top_n: 30
    buffer_mult: 2.0
    boards: [MAIN, CHINEXT, STAR, BSE]
  aum_1e7:
    aum: 10000000
    top_n: 100
    buffer_mult: 2.0
    boards: [MAIN, CHINEXT, STAR, BSE]
output:
  windows_dir: /mnt/d/MCS_26S2课程资料/quantmind/formal_reports
