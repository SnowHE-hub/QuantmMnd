# 主线 A v2 · 策略干预的非劣界限（用户 2026-10-21 批准 Claude 建议的初始值）
# 只用于"改变策略的模块"；纯工程改动用"同快照同策略结果一致"验收（X0）。
# 每个挑战臂在登记时引用本文件的版本号；不得按实验结果回头修改。
version: 1
approved_utc: "2026-10-21"
approved_by: user
margins:
  delta_R: 0.01    # 年化净超额允许的最大下降（绝对值，1 个百分点）
  delta_D: 0.02    # 相对财富最大回撤允许的最大增加（绝对值，2 个百分点）
rules:
  non_inferior_return: "LCB(Δ 年化净超额) > -delta_R"
  non_inferior_drawdown: "UCB(Δ 相对财富最大回撤) < delta_D"
  interval: "配对日收益序列的移动块自助（块长按持有期登记），单侧 95%；同一族多个挑战臂时按登记的族做多重比较校正"
  baseline: "同期限、同账户权限线、同容量情景的参考臂"
  forward_length: "按功效规划登记（调仓频率、持有期、时间依赖、最小可检测效应）；26 周只是观察里程碑"
